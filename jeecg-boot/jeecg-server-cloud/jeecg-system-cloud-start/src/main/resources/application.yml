server:
  port: 7001

spring:
  application:
    name: jeecg-system
  config:
    import:
      - optional:nacos:jeecg.yaml
      - optional:nacos:jeecg-${SPRING_PROFILES_ACTIVE:dev}.yaml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:jeecg-boot-nacos:8848}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        namespace: ${NACOS_NS:}
        username: ${NACOS_USER:}
        password: ${NACOS_PWD:}
      discovery:
        server-addr: ${spring.cloud.nacos.config.server-addr}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        namespace: ${NACOS_NS:}
        username: ${NACOS_USER:}
        password: ${NACOS_PWD:}
        ip: ${NACOS_DISCOVERY_IP:}
jeecg:
  discovery:
    auto-ip:
      enabled: ${JEECG_DISCOVERY_AUTO_IP_ENABLED:true}
      force: ${JEECG_DISCOVERY_AUTO_IP_FORCE:true}