server:
  port: 7009
  servlet:
    context-path: /dataingest

# NiFi 集成配置（来自 application-dataingest.yml）
nifi:
  api:
    base-url: http://localhost:8080/nifi-api
    timeout: 5000
    connection-timeout: 3000
    read-timeout: 10000
  notification:
    enabled: true
    async: true

spring:
  application:
    name: jeecg-dataingest
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  autoconfigure:
    exclude:
      - com.alibaba.druid.spring.boot.autoconfigure.DruidDataSourceAutoConfigure
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  #postgresql 报错问题
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        temp:
          use_jdbc_metadata_defaults: false
  datasource:
    druid:
      stat-view-servlet:
        enabled: true
        loginUsername: admin
        loginPassword: 123456
        allow:
      web-stat-filter:
        enabled: true
    dynamic:
      druid: # 全局druid参数，绝大部分值和默认保持一致。(现已支持的参数如下,不清楚含义不要乱设置)
        # 连接池的配置信息
        # 初始化大小，最小，最大
        initial-size: 5
        min-idle: 5
        maxActive: 1000
        # 配置获取连接等待超时的时间
        maxWait: 60000
        # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
        timeBetweenEvictionRunsMillis: 60000
        # 配置一个连接在池中最小生存的时间，单位是毫秒
        minEvictableIdleTimeMillis: 300000
        #        validationQuery: SELECT 1
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        # 打开PSCache，并且指定每个连接上PSCache的大小
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        # 配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
        # !!!!!mysql
        #        filters: stat,slf4j,wall
        # !!!!!DM
        filters: stat,slf4j
        # 允许SELECT语句的WHERE子句是一个永真条件
        #        wall:
        #          selectWhereAlwayTrueCheck: false
        # 打开mergeSql功能；慢SQL记录
        stat:
          merge-sql: true
          slow-sql-millis: 5000
      datasource:
        master:
          ## !!!!!MYSQL
          # url: jdbc:mysql://localhost:3306/jeecg-boot-dev?characterEncoding=UTF-8&useUnicode=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          # username: root
          # password: 123456
          # driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:postgresql://jeecg-boot-pgsql:5432/jeecg-boot?stringtype=unspecified
          username: postgres
          password: postgres
          driver-class-name: org.postgresql.Driver
  redis:
    database: 0
    host: jeecg-boot-redis
    port: 6379
    password:
    timeout: 3000ms
    # 指定客户端为 Lettuce，确保与 Spring Boot 2.7 配套
    client-type: lettuce
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: -1ms



# 微服务配置
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDR:jeecg-boot-nacos:8848}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USER:nacos}
        password: ${NACOS_PWD:nacos}
      discovery:
        server-addr: ${spring.cloud.nacos.config.server-addr}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USER:nacos}
        password: ${NACOS_PWD:nacos}
  config:
    import:
      - optional:nacos:jeecg-dataingest.yaml
      - optional:nacos:jeecg-dataingest-${spring.profiles.active}.yaml

# 数据摄入服务配置
jeecg:
  dataingest:
    # 数据摄入相关配置
    enabled: true
    # 数据源配置
    datasource:
      # 可以在这里添加数据摄入相关的配置
      enabled: true
  #分布式锁配置
  redisson:
    address: jeecg-boot-redis:6379
    password:
    type: STANDALONE
    enabled: true
  # Shiro 放行白名单
  shiro:
    excludeUrls: /dataingest/health/**,/dataingest/actuator/**,/dataingest/swagger-ui/**,/dataingest/v3/api-docs/**

# Debezium配置
org-jeecg-dataingest-debezium:
  sqlserver:
    hostname: localhost
    port: 1433
    database: testdb
    username: sa
    password: password
    server-name: sqlserver-connector
    table-include-list: dbo.invoice,dbo.material
    table-exclude-list: dbo.sys_%
    column-include-list: 
    column-exclude-list: 
  postgres:
    url: jdbc:postgresql://localhost:5432/jeecg-boot-dev
    username: postgres
    password: postgres
    schema: public
    table-prefix: ods_
  common:
    snapshot-mode: initial
    offset-storage: org.apache.kafka.connect.storage.FileOffsetBackingStore
    offset-storage-file-filename: offset.dat
    offset-flush-interval-ms: 60000
    name: sqlserver-connector
    database-history: io.debezium.relational.history.FileDatabaseHistory
    database-history-file-filename: dbhistory.dat

# Debezium 集群配置（来自 application-dataingest.yml）
debezium:
  enabled: false
  cluster:
    enabled: true
    node-id: ${spring.application.name}-${server.port}
    heartbeat-interval: 30
    assignment-interval: 60
    node-timeout: 180
  storage:
    offset-path: /tmp/debezium/offsets
    history-path: /tmp/debezium/history
  processing:
    batch-size: 1000
    process-interval: 5000
    max-retry: 3

# 金蝶配置
org-jeecg-dataingest-kingdee:
  cloud:
    base-url: https://api.kingdee.com
    app-id: your-app-id
    app-secret: your-app-secret
    username: your-username
    password: your-password
    lcid: 2052
    db-id: your-db-id
  k3:
    base-url: http://localhost:8080
    username: your-username
    password: your-password
    lcid: 2052
    db-id: your-db-id
  common:
    connect-timeout: 30000
    read-timeout: 60000
    max-retries: 3
    token-cache-time: 7200000

# XXL-Job配置
xxl:
  job:
    # 调度中心地址：根据你的环境修改为可达地址（本机示例）
    admin-addresses: http://jeecg-boot-xxljob:9080/xxl-job-admin
    # 执行器名称：需与调度中心执行器分组一致
    appname: data-ingest-executor
    address: http://host.docker.internal:10099
    ip: 
    port: 10099
    log-path: /data/applogs/xxl-job/jobhandler
    log-retention-days: 30
    # 若调度中心设置了登录/访问 Token，请同步配置（没有可留空）
    access-token: 

# 日志配置
logging:
  level:
    org.jeecg.modules.dataingest: DEBUG
    io.debezium: INFO
    com.alibaba.nacos: DEBUG
    com.alibaba.cloud.nacos: DEBUG
    # SQL日志级别（来自 application-dataingest.yml）
    org.jeecg.common.util.SqlInjectionUtil: INFO
  file:
    name: logs/dataingest.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# 来自 application-dataingest.yml 的自定义日志级别
# 保持现有级别为主，如需更细粒度可在此扩展
# org.jeecg.common.util.SqlInjectionUtil: INFO

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Jeecg 通用配置（通过 yml 管理 Shiro 放行白名单，已合并至上方 jeecg 节点）

# 项目人员信息集成配置（由 application-dataingest.yml 合并而来）
projectworker:
  yichangApi:
    base: https://zhcjsmz.sanxiacloud.com
    personPath: /labor/externalCall/person
    attendancePath: /laboratt/attendance/page/
    # 说明：上游考勤分页参数为 page 与 limit；page 从 1 开始自增，limit 对应下方 pageSize
    enablePhotoEnrich: false
  d6cApi:
    gateway: https://d6cnext.haolink.cn/dcs/biz/openapi/openApi/post
    #gateway: https://d6ctest.haolinkserver.cn/dcs/biz/openapi/openApi/post
    supplier: NEWGRAND
    method:
      companyBasic: Corp.Upload
      company: ProjectCorp.Upload
      team: ProjectTeam.Upload
      personBasic: ProjectWorker.Upload
      person: ProjectWorkerEntryExit.Upload
      attendance: ProjectWorkerAttendance.Upload
  attendance:
    # ===== 分页与限流参数说明 =====
    # pageSize：索引分页每页条数（limit），上游最大建议 500
    # maxPagesPerDay：单日最大翻页数（保护上限），总拉取上限 = pageSize * maxPagesPerDay
    # requestTimeoutMs：上游接口请求超时（毫秒）
    # qpsLimitYichang / qpsLimitD6c：对上游/下游的软限流 QPS（0 表示不限）
    # maxPostBatchSize：推送到 D6C 的单批最大条数（>0 时仅影响推送分片，与上游分页无关）
    # 说明：索引分页按 page=1..N, limit=pageSize 拉取；当脱敏身份证无法唯一解析时，会对候选明文身份证做一次
    # “精确查询”（带 idCardNumber 参数），该查询固定使用 page=1&limit=100 仅用于补齐数据，不会“切分” 500 的索引分页。
    enableIndexScan: true
    enableCascadeAfterWorkerSync: false
    dropUnknownEngId: true
    pageSize: 500 # 索引分页每页条数（limit）
    maxPagesPerDay: 10000
    concurrentFetch: 8 # 按人精准拉取的并发数（回退路径使用）
    concurrentPost: 4  # 推送到 D6C 的并发数
    requestTimeoutMs: 100000 # 上游接口请求超时（毫秒）
    retryMaxAttempts: 3
    retryBackoffMs: 300
    qpsLimitYichang: 0 # 宜昌 API QPS 软限流（0 表示不限）
    qpsLimitD6c: 0     # D6C API QPS 软限流（0 表示不限）
    maxPostBatchSize: 0 # D6C 单批最大推送条数（>0 时会分片推送）
    cache:
      resolveTtlDays: 7   # 强键解析缓存（天）
      candidateTtlHours: 24 # 候选集合缓存（小时）
  projectConfig:
    # 外部 JSON 路径。支持前缀: classpath:/ 与 file:/
    # 示例：PROJECTWORKER_PROJECTS_PATH=file:/etc/jeecg/dataingest/projectworker/project-projects.json
    jsonPath: ${PROJECTWORKER_PROJECTS_PATH:classpath:projectworker/project-projects.json}
    nacos:
      enabled: false
      # 仅需 dataId 和 group，其它连接参数沿用 spring.cloud.nacos.config.*
      dataId: projectworker-projects.json
      group: ${NACOS_GROUP:DEFAULT_GROUP}
      timeoutMs: 3000
  defaults:
    defaultBase64Image: ""
    corpTypeMapping: {}
    corpCodeMapping: {}
    workTypeRules: []
